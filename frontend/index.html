<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端 viewport：使用默认 viewport-fit=auto（禁止写回 cover）——
         Android 15+/16 强制 edge-to-edge（targetSdk 36）下 cover 让 WebView 内容延伸到状态栏后，
         env(safe-area-inset-top) 返回真实状态栏高度（真机 top=状态栏+24px≈60px+），
         而 MuMu 等旧系统镜像模拟器 env() 恒为 0（top=24px），两端位置不一致。
         auto 模式 WebView 自动把布局限制在系统安全区内，env() 两端恒为 0，视觉完全一致。
         maximum-scale=5 保留缩放能力（不设置 user-scalable=no 以保持可访问性） -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <!-- 主题色：根据系统深浅色模式动态切换状态栏与窗口标题颜色（信号青主色） -->
    <meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <!-- iOS Safari 添加到主屏时的行为与样式 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Open-AwA" />
    <!-- Android Chrome 添加到主屏时的行为 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Open-AwA AI Agent</title>
    <!-- PWA manifest 与图标 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- 字体声明：使用本地 Inter 字体（若已安装）+ 系统字体栈回退，零外部 CDN 依赖，零加载延迟 -->
    <style>
      @font-face {
        font-family: 'Inter';
        src: local('Inter'),
             local('Inter Variable'),
             local('Inter-Variable');
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const hostname = window.location.hostname
        const localHostnames = new Set(['localhost', '127.0.0.1', '::1', '[::1]'])
        if (!localHostnames.has(hostname)) {
          return
        }

        const retiredCacheName = 'anime-blog-v4'
        const reloadMarkerName = 'openawa:legacy-service-worker-retired'
        const isRetiredWorker = (worker) => {
          if (!worker || !worker.scriptURL) {
            return false
          }

          try {
            const scriptUrl = new URL(worker.scriptURL, window.location.href)
            return scriptUrl.origin === window.location.origin && scriptUrl.pathname === '/sw.js'
          } catch (error) {
            console.warn('无法解析待退役的 Service Worker 地址', error)
            return false
          }
        }

        const isRetiredWorkerRegistration = (registration) => {
          const worker = registration.active || registration.waiting || registration.installing
          return isRetiredWorker(worker)
        }

        const retireLegacyServiceWorker = async () => {
          const controlledByRetiredWorker = 'serviceWorker' in navigator
            && isRetiredWorker(navigator.serviceWorker.controller)
          const unregisterTask = 'serviceWorker' in navigator
            ? navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(
                registrations
                  .filter(isRetiredWorkerRegistration)
                  .map((registration) => registration.unregister()),
              ))
            : Promise.resolve([])
          const cacheCleanupTask = 'caches' in window
            ? caches.delete(retiredCacheName)
            : Promise.resolve(false)
          const [unregisterResults] = await Promise.all([unregisterTask, cacheCleanupTask])

          if (!controlledByRetiredWorker) {
            try {
              sessionStorage.removeItem(reloadMarkerName)
            } catch (error) {
              console.warn('无法清理 Service Worker 退役刷新标记', error)
            }
            return
          }

          if (!unregisterResults.some(Boolean)) {
            return
          }

          try {
            if (sessionStorage.getItem(reloadMarkerName) !== '1') {
              sessionStorage.setItem(reloadMarkerName, '1')
              window.location.reload()
            }
          } catch (error) {
            // 无法持久化一次性标记时不自动刷新，避免异常环境中的刷新循环。
            console.warn('无法保存 Service Worker 退役刷新标记', error)
          }
        }

        retireLegacyServiceWorker().catch((error) => {
          console.warn('清理历史 Service Worker 失败', error)
        })
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
