# ============================================================================
# Open-AwA API 自动化测试用例定义
# 版本: 1.0.0
# 描述: 覆盖项目全部 24 个 API 路由模块的核心测试场景
# ============================================================================

name: "Open-AwA API 自动化测试用例集"
version: "1.0.0"
description: "覆盖全部 API 路由模块的核心正常路径和异常路径测试用例"
base_url: "http://127.0.0.1:8000"

# ============================================================================
# 按模块分组的测试用例
# ============================================================================

modules:

  # ==========================================================================
  # 1. System — 系统健康检查与诊断
  # ==========================================================================
  system:
    - id: "sys-001"
      name: "服务健康检查"
      module: "system"
      description: "验证 GET /health 端点可正常访问"
      method: "GET"
      path: "/health"
      requires_auth: false
      timeout_seconds: 10
      priority: "high"
      tags: ["smoke", "health"]
      assertions:
        - type: "status_code"
          expected: 200
          description: "返回 200 状态码"
        - type: "json_path"
          field: "status"
          expected: "ok"
          operator: "eq"
          description: "status 字段应为 ok"

    - id: "sys-002"
      name: "系统全量诊断"
      module: "system"
      description: "验证 GET /api/v1/system/diagnostics 端点"
      method: "GET"
      path: "/api/v1/system/diagnostics"
      requires_auth: true
      timeout_seconds: 30
      priority: "high"
      tags: ["smoke", "diagnostics"]
      assertions:
        - type: "status_code"
          expected: 200
          description: "返回 200"
        - type: "json_path"
          field: "checks"
          expected: "any"
          operator: "is_not_none"
          description: "checks 字段存在"

  # ==========================================================================
  # 2. Auth — 用户认证
  # ==========================================================================
  auth:
    - id: "auth-001"
      name: "CSRF Token 获取"
      module: "auth"
      description: "验证 GET /api/v1/auth/csrf-token 正常返回"
      method: "GET"
      path: "/api/v1/auth/csrf-token"
      requires_auth: false
      timeout_seconds: 10
      priority: "high"
      tags: ["smoke", "auth"]
      assertions:
        - type: "status_code"
          expected: 200
          description: "返回 200"
        - type: "json_path"
          field: "token"
          expected: "any"
          operator: "is_not_none"
          description: "token 字段存在"

    - id: "auth-002"
      name: "获取当前用户信息（无认证应 401）"
      module: "auth"
      description: "未认证访问 /api/v1/auth/me 应返回 401"
      method: "GET"
      path: "/api/v1/auth/me"
      requires_auth: false
      timeout_seconds: 10
      priority: "high"
      tags: ["auth", "security"]
      assertions:
        - type: "status_code"
          expected: 401
          description: "未认证应返回 401"

  # ==========================================================================
  # 3. Conversation — 会话管理
  # ==========================================================================
  conversation:
    - id: "conv-001"
      name: "获取会话列表"
      module: "conversation"
      description: "验证 GET /api/v1/conversation/ 端点"
      method: "GET"
      path: "/api/v1/conversation/"
      requires_auth: true
      timeout_seconds: 15
      priority: "high"
      tags: ["smoke", "conversation"]
      assertions:
        - type: "status_code"
          expected: 200
          description: "返回 200"
        - type: "json_path"
          field: "conversations"
          expected: "list"
          operator: "is_not_none"
          description: "conversations 字段存在"

    - id: "conv-002"
      name: "创建新会话"
      module: "conversation"
      description: "验证 POST /api/v1/conversation/ 创建会话"
      method: "POST"
      path: "/api/v1/conversation/"
      requires_auth: true
      timeout_seconds: 15
      priority: "normal"
      tags: ["conversation", "create"]
      body:
        title: "[自动化测试] 测试会话"
      assertions:
        - type: "status_code"
          expected: 200
          description: "创建会话返回 200"
        - type: "json_path"
          field: "session_id"
          expected: "non_empty_str"
          operator: "is_not_none"
          description: "应返回 session_id"

  # ==========================================================================
  # 4. Chat — AI 聊天
  # ==========================================================================
  chat:
    - id: "chat-001"
      name: "获取聊天消息列表"
      module: "chat"
      description: "验证 GET /api/v1/chat/messages 端点"
      method: "GET"
      path: "/api/v1/chat/messages"
      requires_auth: true
      timeout_seconds: 15
      priority: "normal"
      tags: ["chat", "messages"]
      assertions:
        - type: "status_code"
          expected: 200
          description: "返回 200"

  # ==========================================================================
  # 5. Skills — 技能系统
  # ==========================================================================
  skills:
    - id: "skill-001"
      name: "获取技能列表"
      module: "skills"
      description: "验证 GET /skills 端点"
      method: "GET"
      path: "/skills"
      requires_auth: true
      timeout_seconds: 15
      priority: "high"
      tags: ["smoke", "skills"]
      assertions:
        - type: "status_code"
          expected: 200
          description: "返回 200"
        - type: "json_path"
          field: "0.id"
          expected: "any"
          operator: "is_not_none"
          description: "应至少返回一条技能记录"

    - id: "skill-002"
      name: "获取不存在的技能详情"
      module: "skills"
      description: "访问不存在的技能 ID 应返回 404"
      method: "GET"
      path: "/skills/non-existent-skill-id-99999"
      requires_auth: true
      timeout_seconds: 10
      priority: "normal"
      tags: ["skills", "error"]
      assertions:
        - type: "status_code"
          expected: 404
          description: "不存在的技能应返回 404"

