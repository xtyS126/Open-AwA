# Alembic 数据库迁移配置
[alembic]
# 迁移脚本目录
script_location = alembic

# 数据库 URL（从环境变量读取，开发默认使用 SQLite）
sqlalchemy.url = sqlite:///openawa.db

# 迁移环境日志级别
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 截断迁移描述长度
truncate_slug_length = 40

# 设置为 true 会在每次迁移完成时生成 SQL 文件
# output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
