[mypy]
# Task 20 CI gate fix: mypy runs as a hard gate (ci.yml removed `|| true`).
# Conservative start to avoid flooding CI with pre-existing untyped errors:
#   - ignore_missing_imports: skip third-party libs without stubs, focus on our code
#   - warn_unused_ignores: disable unused `# type: ignore` warnings to reduce noise
# NOTE: keep this file ASCII-only - Windows configparser reads .ini with the
#       locale encoding (GBK) and crashes on non-ASCII bytes.
ignore_missing_imports = True
warn_unused_ignores = False

# Exclude external skill packages that ship their own `core` package,
# which collides with the backend root `core` module (Duplicate module).
# Exclude test tree: pytest conftest.py files collide as duplicate modules,
# and test code is validated at runtime by pytest, not by the type gate.
# NOTE: mypy does not support multi-line values; keep this a single line regex.
exclude = (^skills/external/|^tests/|^conftest\.py$)
