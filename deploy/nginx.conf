# Open-AwA Nginx 配置 - 基础版（HTTP）
# 用于 frontend/Dockerfile 镜像：提供静态文件 + 反向代理 /api 到后端
# 生产环境 SSL 配置见 deploy/nginx/ssl.conf（由 docker-compose.prod.yml 挂载覆盖）

# 限流区域定义：每 IP 每秒 10 个请求，突发 20 个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 登录限流：每 IP 每秒 5 个请求，突发 10 个（更严格）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# 上游后端服务（命名与服务名一致，便于 docker compose 网络解析）
upstream backend_upstream {
    server backend:8000;
    # 失败重试配置：3 次失败标记为不可用，5 秒后重试
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    # 隐藏 nginx 版本号，避免暴露漏洞信息
    server_tokens off;

    # 请求体大小限制：默认 10MB（与后端 MAX_UPLOAD_SIZE 一致）
    client_max_body_size 10m;
    # 客户端缓冲区限制：防止慢速攻击
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # 静态资源缓存（带指纹的资源永久缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查端点（不记日志、不限流）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API 反向代理到后端
    location /api/ {
        # 限流：突发请求排队，超过则返回 429
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        # keepalive 复用连接
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置：API 调用可能涉及 LLM 长响应
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 缓冲配置：禁用缓冲以支持流式响应
        proxy_buffering off;
        proxy_cache off;
    }

    # 登录认证端点限流更严格
    location ~ ^/api/auth/(login|register|forgot-password)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket 代理（聊天 ws + 终端 PTY）
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（1 小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 关闭 nginx 缓冲
        proxy_buffering off;
    }

    # MCP SSE 代理（Server-Sent Events 流式响应）
    location /api/mcp/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE 必须关闭缓冲，否则事件会被合并延迟
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SPA 路由回退（前端 React Router 的 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 通用安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 自定义错误页（避免暴露 nginx 默认错误页）
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # 访问日志（生产环境可关闭以提升性能）
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
