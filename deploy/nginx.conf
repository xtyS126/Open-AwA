# Open-AwA Nginx 配置 - 基础版（HTTP/2 + 自签 SSL）
# 用于 frontend/Dockerfile 镜像：提供静态文件 + 反向代理 /api 到后端
# 开发/测试环境使用自签证书（由 init-ssl.sh 在容器启动时生成）
# 生产环境 SSL 配置见 deploy/nginx/ssl.conf（由 docker-compose.prod.yml 挂载覆盖）

# 限流区域定义：每 IP 每秒 10 个请求，突发 20 个
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 登录限流：每 IP 每秒 5 个请求，突发 10 个（更严格）
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# 普通 HTTP 请求清空 Connection，WebSocket 请求统一升级。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 上游后端服务（命名与服务名一致，便于 docker compose 网络解析）
upstream backend_upstream {
    server backend:8000;
    # 失败重试配置：3 次失败标记为不可用，5 秒后重试
    keepalive 32;
    keepalive_timeout 60s;
}

# 80 端口：重定向到 443（健康检查端点例外，便于容器健康检查直接通过）
server {
    listen 80;
    # 显式声明 IPv6 监听，避免 nginx 官方镜像 entrypoint 脚本改写 listen 80;
    # 同时实现 IPv4/IPv6 双栈监听
    listen [::]:80;
    server_name _;

    # 健康检查端点不重定向，返回 200 便于 docker healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 其他请求一律 301 重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 端口：HTTP/2 + SSL 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 隐藏 nginx 版本号，避免暴露漏洞信息
    server_tokens off;

    # SSL 证书路径（由 init-ssl.sh 在容器启动时生成自签证书）
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    # 仅允许 TLS 1.2 / 1.3，禁用过时的 TLS 1.0 / 1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    # SSL 会话缓存，减少重复握手开销
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 请求体大小限制：默认 10MB（与后端 MAX_UPLOAD_SIZE 一致）
    client_max_body_size 10m;
    # 客户端缓冲区限制：防止慢速攻击
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # 静态资源缓存（带指纹的资源永久缓存）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查端点（不记日志、不限流）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API 反向代理到后端
    location /api/ {
        # 限流：突发请求排队，超过则返回 429
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        # 同一 /api 入口同时承载普通 HTTP、SSE 与 WebSocket。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置：API 调用可能涉及 LLM 长响应
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 缓冲配置：禁用缓冲以支持流式响应
        proxy_buffering off;
        proxy_cache off;
    }

    # 登录认证端点限流更严格
    location ~ ^/api/auth/(login|register|forgot-password)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # MCP SSE 代理（Server-Sent Events 流式响应）
    location /api/mcp/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE 必须关闭缓冲，否则事件会被合并延迟
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SPA 路由回退（前端 React Router 的 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 通用安全头（HTTPS 模式启用 HSTS，强制浏览器后续走 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 自定义错误页（避免暴露 nginx 默认错误页）
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # 访问日志（生产环境可关闭以提升性能）
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
